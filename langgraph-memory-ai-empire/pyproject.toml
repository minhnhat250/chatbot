[project]
name = "langgraph-memory-ai-empire"
version = "1.0.0"
description = "Mã thực hành cho giáo trình Bộ nhớ hội thoại với LangGraph"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "langgraph>=1.0,<2",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
providers = [
    "langchain-google-genai>=2.1",
    "langchain-openai>=0.3",
]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
addopts = "-ra"
